<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bharat Drive Demo</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111a;font-family:Arial,sans-serif;color:#fff;touch-action:none}canvas{width:100%;height:100%;display:block}.menu,.pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#07131d,#12354d);z-index:10}.card{width:min(720px,92vw);background:#071722ee;border:1px solid #ffffff24;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}.brand{font-size:clamp(38px,7vw,72px);font-weight:900;line-height:.9}.gold{color:#e5b83e}.desc{color:#b8c6d0;line-height:1.5}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}select,button{min-height:46px;border-radius:12px;border:1px solid #ffffff26;background:#102a3d;color:#fff;padding:10px;font-size:15px}button.primary{width:100%;background:#e5b83e;color:#0b1b28;font-weight:900}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.pill{background:#071722c8;border:1px solid #ffffff22;border-radius:12px;padding:8px 12px;font-weight:800}.stats{display:flex;gap:6px}.stat{background:#071722c8;border:1px solid #ffffff22;border-radius:12px;padding:6px 10px;text-align:center;min-width:62px}.stat small{display:block;color:#9fb1bd;font-size:8px}.controls{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:flex;gap:10px;pointer-events:auto}.ctl{width:72px;height:72px;border-radius:22px;background:#071722cc;font-size:24px;font-weight:900}.pedal{height:88px;font-size:12px}.gas{background:#176a42d9}.brake{background:#8d332dd9}.horn{position:absolute;right:12px;top:75px;width:56px;height:50px;pointer-events:auto}.route{position:absolute;left:12px;top:75px;background:#071722cc;border-radius:12px;padding:8px 11px;font-size:11px}.hidden{display:none!important}.pause .card{text-align:center;width:min(360px,90vw)}@media(max-width:600px){.row{grid-template-columns:1fr}.ctl{width:62px;height:62px}.pedal{height:76px}.route,.horn{top:105px}}
</style></head><body>
<canvas id="g"></canvas>
<div id="menu" class="menu"><div class="card"><div class="brand">BHARAT <span class="gold">DRIVE</span></div><p class="desc">Indian scenic car simulator demo with Himalayan hills, Western Ghats, Gujarat village roads, Rajasthan desert, Konkan coast, traffic, river bridges, waterfall, weather, engine sound and horn.</p><div class="row"><select id="route"><option value="himalaya">Himalayan Hills</option><option value="ghats">Western Ghats</option><option value="gujarat">Gujarat Village Highway</option><option value="rajasthan">Rajasthan Desert</option><option value="konkan">Konkan Coast</option></select><select id="car"><option value="suv">Bharat SUV</option><option value="sedan">Executive Sedan</option><option value="hatch">City Hatch</option></select><select id="weather"><option value="auto">Dynamic Weather</option><option value="clear">Clear</option><option value="rain">Rain</option><option value="fog">Fog</option></select></div><button id="start" class="primary">START DRIVE</button></div></div>
<div id="hud" class="hud hidden"><div class="top"><div class="pill"><span class="gold">BHARAT</span> DRIVE DEMO</div><div class="stats"><div class="stat"><small>SPEED</small><b id="speed">0</b></div><div class="stat"><small>GEAR</small><b id="gear">N</b></div><div class="stat"><small>FUEL</small><b id="fuel">100%</b></div></div></div><div class="route"><b id="rname">Himalayan Hills</b><br><span id="cond">CLEAR ROAD</span></div><button id="horn" class="horn">📣</button><div class="controls"><div class="cluster"><button id="left" class="ctl">◀</button><button id="right" class="ctl">▶</button></div><div class="cluster"><button id="brake" class="ctl pedal brake">BRAKE</button><button id="gas" class="ctl pedal gas">GAS</button></div></div></div>
<script>
(()=>{const c=document.getElementById('g'),ctx=c.getContext('2d'),$=i=>document.getElementById(i);let W,H,dpr,last=performance.now(),play=false,t=0,spd=0,lane=0,dist=0,fuel=100,route='himalaya',car='suv',weather='auto',traffic=[],spawn=0,audio,osc,gain;const key={l:0,r:0,g:0,b:0};const R={himalaya:{n:'Himalayan Hills',a:'#72acd1',b:'#dceef7',g:'#5d7754',m:'#67808d',w:1},ghats:{n:'Western Ghats',a:'#68a5ad',b:'#c4e1d1',g:'#316847',m:'#365c49',w:1.2},gujarat:{n:'Gujarat Village Highway',a:'#79b8d5',b:'#d7ebb7',g:'#7c944e',m:'#89945b',w:.7},rajasthan:{n:'Rajasthan Desert',a:'#83b8d0',b:'#f1cf91',g:'#b98249',m:'#a87042',w:.5},konkan:{n:'Konkan Coast',a:'#65b3d0',b:'#c7eadc',g:'#2f704b',m:'#35664d',w:1}};const C={suv:{max:185,acc:62,h:1},sedan:{max:205,acc:68,h:1.1},hatch:{max:170,acc:76,h:1.25}};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function curve(z){return Math.sin(t*.13+z*1.7)*.17*R[route].w+Math.sin(t*.041+z*.5)*.1}function mount(px,base,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(px,base);ctx.lineTo(px+w*.5,base-h);ctx.lineTo(px+w,base);ctx.closePath();ctx.fill()}function tree(px,py,s,palm){if(palm){ctx.strokeStyle='#654629';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(px,py+42*s);ctx.lineTo(px+5*s,py);ctx.stroke();ctx.strokeStyle='#2d7146';ctx.lineWidth=4*s;for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(px+5*s,py);ctx.lineTo(px+k*18*s,py-15*s+Math.abs(k)*4*s);ctx.stroke()}return}ctx.fillStyle='#60442c';ctx.fillRect(px-4*s,py,8*s,34*s);ctx.fillStyle=route==='rajasthan'?'#627746':'#2f6a44';ctx.beginPath();ctx.arc(px,py,21*s,0,7);ctx.arc(px-12*s,py+9*s,15*s,0,7);ctx.arc(px+14*s,py+9*s,16*s,0,7);ctx.fill()}function house(px,py,s){ctx.fillStyle='#e1bd84';ctx.fillRect(px,py,64*s,40*s);ctx.fillStyle='#934d32';ctx.beginPath();ctx.moveTo(px-5*s,py);ctx.lineTo(px+32*s,py-24*s);ctx.lineTo(px+69*s,py);ctx.closePath();ctx.fill()}function bg(){let r=R[route],gr=ctx.createLinearGradient(0,0,0,H*.6);gr.addColorStop(0,r.a);gr.addColorStop(1,r.b);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);let hy=H*.53;mount(-W*.08,hy,W*.45,H*.24,r.m);mount(W*.22,hy,W*.48,H*.29,r.m);mount(W*.57,hy,W*.5,H*.22,r.m);ctx.fillStyle=r.g;ctx.fillRect(0,hy,W,H-hy);if(route==='konkan'){ctx.fillStyle='#3d91b5';ctx.fillRect(0,hy+25,W,H*.15)}if(route==='gujarat'){house(W*.07,hy-6,.8);house(W*.8,hy-3,.85)}for(let i=0;i<8;i++)tree((i+.2)*W/8,hy-12+(i%2)*20,.55+(i%3)*.1,route==='konkan')}function road(){let hy=H*.55,c0=W*.5+curve(0)*W*.22,c1=W*.5+curve(1)*W*.4;ctx.fillStyle='#474b50';ctx.beginPath();ctx.moveTo(c0-W*.075,hy);ctx.lineTo(c0+W*.075,hy);ctx.lineTo(c1+W*.43,H);ctx.lineTo(c1-W*.43,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#eee4be';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(c0-W*.075,hy);ctx.lineTo(c1-W*.43,H);ctx.stroke();ctx.beginPath();ctx.moveTo(c0+W*.075,hy);ctx.lineTo(c1+W*.43,H);ctx.stroke();ctx.strokeStyle='#fff';ctx.setLineDash([20,22]);ctx.beginPath();ctx.moveTo(c0,hy);ctx.lineTo(c1,H);ctx.stroke();ctx.setLineDash([]);if(route!=='rajasthan'&&dist%10>5&&dist%10<6.4){ctx.fillStyle='#4997bd';ctx.fillRect(0,H*.69,W,H*.07);ctx.fillStyle='#747a7e';ctx.fillRect(W*.16,H*.70,W*.68,H*.045);$('cond').textContent='RIVER BRIDGE'}}function rounded(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function drawCar(px,py,s,col,p){ctx.save();ctx.translate(px,py);let w=82*s,h=112*s;ctx.fillStyle=col;ctx.beginPath();rounded(-w/2,-h/2,w,h,11*s);ctx.fill();ctx.fillStyle='#182731';ctx.fillRect(-w*.31,-h*.22,w*.62,h*.27);ctx.fillStyle='#111';ctx.fillRect(-w*.57,-h*.24,w*.11,h*.28);ctx.fillRect(w*.46,-h*.24,w*.11,h*.28);ctx.fillRect(-w*.57,h*.12,w*.11,h*.28);ctx.fillRect(w*.46,h*.12,w*.11,h*.28);ctx.fillStyle=p?'#f1c64c':'#f4f1dc';ctx.fillRect(-w*.3,-h*.47,w*.2,h*.07);ctx.fillRect(w*.1,-h*.47,w*.2,h*.07);ctx.restore()}function spawnT(){let co=['#c84d45','#3f7fba','#e0b440','#7c5d9c','#e2e5e7','#2d6d50'];traffic.push({l:Math.random()>.5?.34:-.34,z:.03,c:co[(Math.random()*co.length)|0]})}function tr(dt){for(let i=traffic.length-1;i>=0;i--){let q=traffic[i];q.z+=dt*(.1+spd/260);if(q.z>1.15){traffic.splice(i,1);continue}let z=q.z,py=H*.55+z*z*H*.4,center=W*.5+curve(z)*W*.4,half=W*(.075+z*.35),px=center+q.l*half;drawCar(px,py,.18+z*.62,q.c,0);if(z>.84&&Math.abs(lane*W*.25-q.l*half)<W*.075){spd*=.75;$('cond').textContent='TRAFFIC • SLOW DOWN'}}}function rain(){let on=weather==='rain'||(weather==='auto'&&Math.sin(t*.02)>.88);if(on){ctx.strokeStyle='#d7efff99';for(let i=0;i<70;i++){let rx=(i*97+t*40)%W,ry=(i*53+t*120)%H;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-5,ry+14);ctx.stroke()}$('cond').textContent='RAIN • WET ROAD'}if(weather==='fog'||(weather==='auto'&&Math.sin(t*.012)<-.92)){ctx.fillStyle='#e4eeee55';ctx.fillRect(0,0,W,H);$('cond').textContent='FOG • LOW VISIBILITY'}}function update(dt){if(key.g)spd+=C[car].acc*dt;else spd-=18*dt;if(key.b)spd-=95*dt;spd=Math.max(0,Math.min(C[car].max,spd));let s=(.55+spd/160)*C[car].h*dt;if(key.l)lane-=s;if(key.r)lane+=s;lane=Math.max(-.95,Math.min(.95,lane));dist+=spd*dt/3600;fuel=Math.max(0,fuel-spd*dt*.0008);if(!fuel)spd=Math.max(0,spd-80*dt);t+=dt*(.8+spd/55);spawn-=dt;if(spawn<=0&&traffic.length<7){spawnT();spawn=.8+Math.random()*1.4}$('speed').textContent=Math.round(spd);$('gear').textContent=spd<2?'N':spd<35?'1':spd<70?'2':spd<105?'3':spd<145?'4':'5';$('fuel').textContent=Math.round(fuel)+'%';if(!(route!=='rajasthan'&&dist%10>5&&dist%10<6.4))$('cond').textContent=spd>145?'HIGH SPEED':'CLEAR ROAD';if(audio){osc.frequency.setTargetAtTime(55+spd*.9,audio.currentTime,.05);gain.gain.setTargetAtTime(.015+spd/2500,audio.currentTime,.08)}}function render(dt){bg();road();tr(dt);let center=W*.5+curve(1)*W*.4,col=car==='sedan'?'#273a49':car==='hatch'?'#d9a833':'#e1e5e8';drawCar(center+lane*W*.25,H*.85,.75,col,1);rain()}function loop(n){let dt=Math.min(.04,(n-last)/1000);last=n;if(play)update(dt);render(play?dt:0);requestAnimationFrame(loop)}function snd(){if(audio)return;audio=new (AudioContext||webkitAudioContext)();gain=audio.createGain();gain.gain.value=.02;osc=audio.createOscillator();osc.type='sawtooth';osc.frequency.value=55;let f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=650;osc.connect(f);f.connect(gain);gain.connect(audio.destination);osc.start()}function horn(){snd();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type='square';o.frequency.value=410;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.15,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+.35);o.connect(g);g.connect(audio.destination);o.start();o.stop(n+.36)}function bind(id,k){let e=$(id),on=v=>{v.preventDefault();key[k]=1;snd();audio.resume()},off=v=>{v.preventDefault();key[k]=0};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',off)}bind('left','l');bind('right','r');bind('gas','g');bind('brake','b');$('start').onclick=()=>{route=$('route').value;car=$('car').value;weather=$('weather').value;$('rname').textContent=R[route].n;$('menu').classList.add('hidden');$('hud').classList.remove('hidden');play=1;snd();audio.resume()};$('horn').onclick=horn;requestAnimationFrame(loop)})();
</script></body></html>
