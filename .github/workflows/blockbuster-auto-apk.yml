name: Blockbuster Auto Player APK (Combo V0.9)
on:
  push:
    branches:
      - blockbuster-autoplay-build
    paths:
      - 'blockbuster-build/**'
      - '.github/workflows/blockbuster-auto-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unpack Java Android source
        shell: bash
        run: |
          cat blockbuster-build/source.part0{0..5} | base64 -d > /tmp/BlockbusterAutoPlayer.tar.xz
          echo 'f57a467dcea351e6c9f2f87695025236ab8b02153216be65475b9dc8144fbb6e  /tmp/BlockbusterAutoPlayer.tar.xz' | sha256sum --check
          tar -xJf /tmp/BlockbusterAutoPlayer.tar.xz
          python3 blockbuster-build/turbo_v04.py
          python3 - <<'PY'
          import base64,zlib,hashlib
          data=base64.b64decode(open('blockbuster-build/ultra_v05.py.zb64').read())
          script=zlib.decompress(data)
          assert hashlib.sha256(script).hexdigest()=='ed81c24e6d57ed5abb38e8e1aa1450699faa1bad910190128c6e2cef8a07e049', 'Patch digest mismatch'
          exec(compile(script,'ultra_v05.py','exec'))
          PY
          python3 blockbuster-build/stable_v06.py
          python3 blockbuster-build/ultrafast_v07.py
          python3 - <<'PY'
          import base64,zlib,hashlib
          packed=base64.b64decode(open('blockbuster-build/max_v08.py.zb64').read())
          patch=zlib.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='41941ca673be6906306cc427f203c5549e4a3a5ae13565e15eae42901730d540'
          exec(compile(patch,'max_v08.py','exec'))
          PY
          python3 - <<'PY'
          import base64,zlib,hashlib
          payload=zlib.decompress(base64.b64decode(open('blockbuster-build/v09_combo_patch.zb64').read()))
          assert hashlib.sha256(payload).hexdigest()=='4d8989f19a06cbe6480df4b95a2dd1866f616bf7ec0a8e9ab2bda34d5dec739e'
          exec(compile(payload,'v09_combo_patch.py','exec'))
          PY
          test -f BlockbusterAutoPlayer/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.10.2'
      - name: Install Android API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMGR=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        working-directory: BlockbusterAutoPlayer
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Blockbuster-Auto-Player-v0.9-COMBO-debug-APK
          path: BlockbusterAutoPlayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
