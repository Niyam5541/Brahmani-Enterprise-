name: Bharat Drive Demo APK
on:
  push:
    branches:
      - chatgpt-bharat-drive-apk-build
    paths:
      - 'bharat-drive-demo/**'
      - '.github/workflows/bd-apk-temp.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: bharat-drive-demo
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect APK
        run: cp bharat-drive-demo/app/build/outputs/apk/debug/app-debug.apk Bharat-Drive-Demo.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bharat-Drive-Demo-APK
          path: Bharat-Drive-Demo.apk
          if-no-files-found: error
